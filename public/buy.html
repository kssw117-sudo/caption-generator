<!DOCTYPE html>
<html lang="ru" id="htmlRoot">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Купить доступ &mdash; TagGenerator AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #F5F4EE; color: #2D2A26; font-family: -apple-system, sans-serif; padding: 24px;
    position: relative; overflow: hidden;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes floatTag {
    0%   { transform: translate(0, 0) rotate(-8deg); }
    50%  { transform: translate(14px, -22px) rotate(4deg); }
    100% { transform: translate(0, 0) rotate(-8deg); }
  }
  .floating-hash {
    position: absolute; font-family: 'Fraunces', serif; font-weight: 700;
    color: rgba(217,119,87,0.16); pointer-events: none; user-select: none;
    animation: floatTag 7s ease-in-out infinite;
  }
  .floating-hash.h1 { font-size: 180px; top: 6%; left: 4%; animation-duration: 8s; }
  .floating-hash.h2 { font-size: 90px; bottom: 8%; right: 8%; animation-duration: 6s; animation-delay: -2s; color: rgba(217,119,87,0.12); }
  .floating-hash.h3 { font-size: 60px; top: 55%; right: 15%; animation-duration: 9s; animation-delay: -4s; color: rgba(217,119,87,0.1); }
  .wrap { max-width: 480px; width: 100%; text-align: center; animation: fadeUp 0.6s ease both; position: relative; z-index: 1; }
  .eyebrow { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #A56A45; margin-bottom: 14px; }
  h1 { font-size: 28px; margin: 0 0 16px; font-family: 'Fraunces', serif; }
  .sub { color: #87837A; font-size: 15px; max-width: 400px; margin: 0 auto 32px; }
  .plan {
    background: #FFFFFF; border: 1px solid #E4E1D6; border-radius: 14px; padding: 32px 24px;
    animation: fadeUp 0.6s ease both; animation-delay: 0.1s;
  }
  .price { font-size: 38px; font-weight: 700; margin-bottom: 4px; }
  .price-note { color: #87837A; font-size: 13px; margin-bottom: 24px; }
  .widget-wrap { display: flex; justify-content: center; }
  .widget-wrap iframe { transition: transform 0.15s ease, box-shadow 0.15s ease; border-radius: 10px; }
  .widget-wrap iframe:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(217,119,87,0.35); }
</style>
</head>
<body>

<span class="floating-hash h1">#</span>
<span class="floating-hash h2">#</span>
<span class="floating-hash h3">#</span>

<div class="wrap">
  <div class="eyebrow">AI-powered &middot; Instant access</div>
  <h1>TagGenerator AI</h1>
  <p class="sub">Turn any post idea into captions and hashtags in seconds &mdash; 20 languages, batch mode, platform-specific formatting.</p>

  <div class="plan">
    <div class="price">$29</div>
    <div class="price-note">one-time payment &middot; lifetime access &middot; secure card payment</div>
    <div class="widget-wrap">
      <iframe title="lava.top" style="border: none" width="250" height="80" src="https://widget.lava.top/34206317-4a91-41e0-b58c-1335c6f16a4b"></iframe>
    </div>
  </div>
</div>

</body>
</html>
