<!DOCTYPE html>
<html lang="en" id="htmlRoot">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Enter your code — TagGenerator AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0; background: #F5F4EE; color: #2D2A26;
    font-family: -apple-system, sans-serif; line-height: 1.6;
    position: relative; overflow-x: hidden;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes floatTag {
    0%   { transform: translate(0, 0) rotate(-8deg); }
    50%  { transform: translate(14px, -22px) rotate(4deg); }
    100% { transform: translate(0, 0) rotate(-8deg); }
  }
  .floating-hash {
    position: absolute; font-family: 'Fraunces', serif; font-weight: 700;
    color: rgba(217,119,87,0.16); pointer-events: none; user-select: none;
    animation: floatTag 7s ease-in-out infinite;
  }
  .floating-hash.h1 { font-size: 160px; top: 6%; left: 4%; animation-duration: 8s; }
  .floating-hash.h2 { font-size: 80px; bottom: 8%; right: 8%; animation-duration: 6s; animation-delay: -2s; color: rgba(217,119,87,0.12); }

  .wrap { max-width: 400px; width: 100%; margin: 0 auto; padding: 24px; position: relative; z-index: 1; }
  .eyebrow { text-align: center; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #A56A45; margin-bottom: 14px; animation: fadeUp 0.5s ease both; }
  h1 { font-family: 'Fraunces', serif; font-size: 28px; text-align: center; margin: 0 0 10px; line-height: 1.2; animation: fadeUp 0.5s ease both; animation-delay: 0.05s; }
  .sub { text-align: center; color: #87837A; font-size: 14px; max-width: 340px; margin: 0 auto 32px; animation: fadeUp 0.5s ease both; animation-delay: 0.1s; }
  .card {
    background: #FFFFFF; border: 1px solid #E4E1D6; border-radius: 16px;
    padding: 28px; animation: fadeUp 0.5s ease both; animation-delay: 0.15s;
  }
  input {
    width: 100%; box-sizing: border-box; border-radius: 10px; padding: 12px 14px; font-size: 15px;
    background: #FAF9F4; border: 1px solid #E4E1D6; color: #2D2A26; margin-bottom: 12px; outline: none;
  }
  button {
    width: 100%; border: none; cursor: pointer; border-radius: 10px; padding: 13px;
    font-size: 15px; font-weight: 600; background: linear-gradient(90deg, #D97757, #BD5D3A); color: #F5F4EE;
    transition: transform 0.15s ease;
  }
  button:hover { transform: translateY(-1px); }
  button:disabled { opacity: 0.6; cursor: default; }
  .error { color: #B34B3C; font-size: 13px; margin-top: 10px; text-align: center; }
  .back-link { text-align: center; margin-top: 16px; }
  .back-link a { color: #A56A45; font-size: 13px; text-decoration: underline; }
</style>
</head>
<body>

<span class="floating-hash h1">#</span>
<span class="floating-hash h2">#</span>

<div class="wrap">
  <div class="eyebrow">TagGenerator AI</div>
  <h1>Enter your code</h1>
  <p class="sub">Unlock unlimited generations.</p>

  <div class="card">
    <input type="text" id="codeInput" placeholder="Your access code" />
    <button id="unlockBtn" onclick="unlock()">Unlock</button>
    <p class="error" id="errorMsg" style="display:none;"></p>
    <div class="back-link"><a href="/">← Back without unlocking</a></div>
  </div>
</div>

<script>
  async function unlock() {
    const code = document.getElementById('codeInput').value.trim();
    const btn = document.getElementById('unlockBtn');
    const errorMsg = document.getElementById('errorMsg');
    errorMsg.style.display = 'none';
    if (!code) return;

    btn.disabled = true;
    btn.textContent = 'Checking...';

    try {
      if (code.toUpperCase().startsWith('TAG-')) {
        const res = await fetch('/api/redeem-appsumo', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code })
        });
        const data = await res.json();
        if (!data.success) {
          throw new Error(data.error || 'Code not recognized.');
        }
      }
      localStorage.setItem('tg_unlocked', 'true');
      localStorage.setItem('tg_licenseCode', code);
      window.location.href = '/?welcome=1';
    } catch (err) {
      errorMsg.textContent = err.message || 'Something went wrong.';
      errorMsg.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Unlock';
    }
  }

  document.getElementById('codeInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') unlock();
  });
</script>

</body>
</html>
